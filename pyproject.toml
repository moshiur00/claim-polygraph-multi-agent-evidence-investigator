[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-polygraph-ng"
version = "0.1.0"
description = "An auditable, evidence-first multi-agent claim investigation system."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Md Moshiur Rahman" },
]
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.2.9,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pypdf>=6.14,<7",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "truststore>=0.10,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
claim-polygraph = "claim_polygraph_ng.cli:main"
claim-polygraph-api = "claim_polygraph_ng.api_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--basetemp=.pytest-tmp",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["claim_polygraph_ng"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
